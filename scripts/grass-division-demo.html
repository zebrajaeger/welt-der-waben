<!doctype html>
<html lang="de">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unabhängige Vorgänge in Zeitlupe</title>
<style>
:root { color-scheme:dark; font:15px system-ui; background:#101c1b; color:#e8f1df; }
body { max-width:1040px; margin:auto; padding:20px; } h1 { font-size:26px; } p { line-height:1.5; }
.controls { display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin:20px 0; }
button { font:inherit; padding:8px; } input { min-width:160px; flex:1; }
#cases { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr)); gap:16px; }
section { padding:14px; border:1px solid #35534a; border-radius:10px; min-width:0; } h2 { font-size:19px; }
canvas { width:100%; display:block; } .details { font-size:13px; font-variant-numeric:tabular-nums; min-height:75px; }
</style>
<h1>Unabhängige Vorgänge in Zeitlupe</h1>
<p>Alle Beispiele zeigen denselben Simulationstick. Kurze und lange Mahlzeiten enden zu unterschiedlichen Zeiten; eine Teilung läuft parallel. Gras wächst in jedem Tick. Überschüssige Nahrung bleibt erhalten, und bei überlebender Beute zieht der Jäger zurück.</p>
<div class="controls"><button id="play">Abspielen</button><button data-tick="13">Kontakt</button><button data-tick="32">Übertragung</button><button data-tick="60">Später</button>
<label for="time">Tick</label><input id="time" type="range" min="0" max="240" value="32"><output id="position"></output></div>
<div id="cases"></div>
<script type="module">
import { defaultConfig } from '/src/config.ts';
import { tick } from '/src/simulation.ts';
import { sampleAnimation } from '/src/animation.ts';
import { layout, render } from '/src/render.ts';
const resident = (id,column,species='herbivore',energy=5) => ({id,column,row:0,species,energy,angle:-Math.PI/2,readyAt:0});
const config = { ...defaultConfig, width:3, height:1,
  herbivore:{...defaultConfig.herbivore,initialCount:0}, carnivore:{...defaultConfig.carnivore,initialCount:0} };
const definitions = [
  { id:'short', title:'Kurze Mahlzeit', grass:[0,2,0], animals:[resident(1,0)] },
  { id:'long', title:'Lange Mahlzeit', grass:[0,8,0], animals:[resident(1,0)] },
  { id:'division', title:'Teilung mit zwei Hälften', grass:[4,0,4], animals:[resident(1,1,'herbivore',19)] },
  { id:'partial', title:'Teilweise Jagd: Beute überlebt', grass:[0,0], width:2,
    animals:[resident(2,0,'carnivore',18),{...resident(1,1,'herbivore',10),readyAt:100000}] },
];
const cases = definitions.map(def => {
  const cfg = { ...config, width:def.width ?? config.width };
  let state = { tick:0,nextId:100,animals:def.animals,grass:def.grass,reservations:{},released:{} };
  const history = [state];
  let seed=37; const random=()=>{ seed=(Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; };
  for(let i=0;i<240;i++){ state=tick(state,cfg,random); history.push(state); }
  const host=document.createElement('section'); host.dataset.case=def.id;
  const heading=document.createElement('h2'); heading.textContent=def.title;
  const canvas=document.createElement('canvas'), details=document.createElement('p'); details.className='details';
  host.append(heading,canvas,details); document.querySelector('#cases').append(host);
  return { cfg,history,canvas,details };
});
const slider=document.querySelector('#time'), play=document.querySelector('#play');
let current=32, playing=false, lastTime, accumulated=0;
const phases={approach:'Vorstoß',transfer:'saugt',follow:'Nachziehen',return:'Rückzug'};
function draw(){
  slider.value=String(current); document.querySelector('#position').textContent=`${current} · ${(current/60).toFixed(2)} s`;
  for(const item of cases){
    const state=item.history[current], frame=sampleAnimation(state), field=layout(item.cfg,item.canvas.parentElement.clientWidth-28,180);
    item.canvas.width=Math.ceil(field.width); item.canvas.height=Math.ceil(field.height);
    render(item.canvas.getContext('2d'),frame.state,item.cfg,field,frame.shapes);
    const description=state.animals.map(a=>`${a.species==='carnivore'?'K':'G'}${a.id}: ${a.energy.toFixed(2)} · ${a.action?.type==='travel'?phases[a.action.phase]:a.action?.type==='divide'?'Teilung':'wartet'}`).join(' | ');
    item.details.textContent=`Gras: ${state.grass.map(g=>g.toFixed(2)).join(' · ')}. ${description}`;
  }
  play.textContent=playing?'Pause':'Abspielen';
}
function animate(now){
  if(!playing)return;
  if(lastTime!==undefined) accumulated+=Math.min(100,now-lastTime);
  lastTime=now;
  while(accumulated>=50 && current<240){current++;accumulated-=50;}
  if(current===240)playing=false;
  draw(); if(playing)requestAnimationFrame(animate);
}
function jump(value){playing=false;lastTime=undefined;accumulated=0;current=value;draw();}
play.addEventListener('click',()=>{playing=!playing;lastTime=undefined;if(playing){if(current===240)current=0;requestAnimationFrame(animate);}draw();});
slider.addEventListener('input',()=>jump(Number(slider.value)));
for(const button of document.querySelectorAll('[data-tick]'))button.addEventListener('click',()=>jump(Number(button.dataset.tick)));
new ResizeObserver(draw).observe(document.querySelector('#cases'));draw();
</script>
</html>
